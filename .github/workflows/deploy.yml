name: Deploy to Server

on:
  push:
    # Deploy wykonuje się tylko dla branch main (Zadanie 5)
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Logowanie do rejestru obrazów (Zadanie 5)
      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Budowanie i wysyłanie obrazu (Zadanie 5)
      - name: Build and Push Docker image
        run: |
          docker build -t mojekonto/django-app:latest .
          docker push mojekonto/django-app:latest

      # Wykonywanie deployu na serwer z użyciem SSH (Zadanie 5)
      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            docker pull mojekonto/django-app:latest
            docker-compose up -d --build
            # Prosty sposób na możliwość rollbacku to przetrzymywanie poprzednich obrazów Docker
