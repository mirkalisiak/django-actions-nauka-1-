name: Deploy to Production

on:
  push:
    branches:
      - [cite_start]main [cite: 84]

jobs:
  deploy:
    [cite_start]name: Automatyczny deploy aplikacji [cite: 73]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - [cite_start]name: Log in to Docker Registry [cite: 79]
        uses: docker/login-action@v3
        with:
          [cite_start]username: ${{ secrets.DOCKER_USERNAME }} # Użycie GitHub Secrets [cite: 83]
          password: ${{ secrets.DOCKER_PASSWORD }}

      - [cite_start]name: Build Docker Image [cite: 78]
        run: docker build -t my-django-app:latest .

      - [cite_start]name: Push Docker Image [cite: 80]
        run: docker push my-django-app:latest

      - [cite_start]name: Deploy to Server [cite: 81]
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            # Przykładowy skrypt wdrożeniowy na serwerze
            docker pull my-django-app:latest
            docker stop django-app || true
            docker rm django-app || true
            docker run -d --name django-app -p 8000:8000 my-django-app:latest
            # Logi deployu będą widoczne w Actions [cite: 90]
